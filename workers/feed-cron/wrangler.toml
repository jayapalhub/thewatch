name = "thewatch-feed-cron"
main = "worker.js"
compatibility_date = "2026-09-01"

# Thursday 13:00 UTC = 6:00 AM Pacific (5:00 AM during daylight time). Pacific DST ends Nov 1 2026.
[triggers]
crons = ["0 13 * * 4"]

[vars]
SITE_URL = "https://bettersecurity.ai"
# ADMIN_TOKEN is a secret: npx wrangler secret put ADMIN_TOKEN
