name = "thewatch-feed-cron"
main = "worker.js"
compatibility_date = "2026-09-01"

# Thursday 13:00 UTC = 6:00 AM Pacific (5:00 AM during daylight time). Pacific DST ends Nov 1 2026.
# The newsletter tick runs every 10 minutes from Friday through Sunday UTC: Saturday 8 AM and Sunday 8 AM fall inside that
# window for every time zone on earth (UTC+14 to UTC-12), so a new city in any zone needs no cron change. The tick is cheap and idempotent.
# The :20 and :40 job board windows were removed with the job board on 2026-10-25.
[triggers]
crons = ["0 13 * * THU", "0 * * * *", "*/10 * * * FRI,SAT,SUN"]

[vars]
SITE_URL = "https://bettersecurity.ai"
# ADMIN_TOKEN is a secret: npx wrangler secret put ADMIN_TOKEN
